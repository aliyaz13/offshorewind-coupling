# =====================================================================
# OffshoreWindRVO coupling pipeline - single source of truth
# =====================================================================
# Change ONLY this file to point the pipeline at your data. Every script
# reads its paths and parameters from here - no hard-coded paths anywhere.

# Root of the data tree. Relative paths are resolved against THIS file's
# folder. Set to an absolute path (e.g. your Nextcloud folder) if the data
# lives outside the repo, e.g.:
#   data_root: "/Users/you/Nextcloud/.../OffshoreWindRVO"
data_root: "./data"

# ---------------------------------------------------------------------
# Per-site configuration
# ---------------------------------------------------------------------
sites:
  HKW:
    # CPT database file inside 01_cpt/
    cpt_merged: "CPT_db_15_OffshoreWindRVO_HKW_merged.csv"
    # Borehole-ID normalization rule: "default" or "nederwiek"
    id_normalization: default
    # Stage A raw lab data are the 4 pre-cleaned CSVs under 02_lab_data_raw/HKW/
    a_process: hkw_csv
    # Stage B01 location inputs (relative to 04_proximity_cpt_lab/locations/HKW/)
    proximity:
      borehole_file: "HKW_boreholes.ags"
      borehole_format: ags          # ags | csv
      cpt_file: "HKW_CPT.ags"
    plot_limits: null                # [xmin, xmax, ymin, ymax] or null

  NWZ:
    cpt_merged: "CPT_db_15_OffshoreWindRVO_Nederwiek_20250117_merged.csv"
    id_normalization: nederwiek
    a_process: nwz_xlsx              # heavy .xlsx scraper (sites/A_process_NWZ_raw.py)
    proximity:
      borehole_file: "NWZ_BH.ags"
      borehole_format: ags
      cpt_file: "NWZ_CPT.ags"
    plot_limits: null

  TNW:
    cpt_merged: "CPT_db_15_OffshoreWindRVO_TNW_merged.csv"
    id_normalization: default
    a_process: tnw_xlsx             # heavy .xlsx scraper (sites/A_process_TNW_raw.py)
    proximity:
      borehole_file: "TNW_boreholes.csv"
      borehole_format: csv
      cpt_file: "TNW_cpt.ags"
    plot_limits: [660000, 690000, 5982500, 6000000]

# ---------------------------------------------------------------------
# Coupling approaches (stage B02)
# ---------------------------------------------------------------------
coupling:
  Appr01:
    # simple nearest-CPT within depth threshold, prefers rows with qc+fs
    threshold: 0.40
  Appr02:
    # refined: depth window + qc stability (CoV) check, requires complete qc+fs
    threshold: 0.25
    cov_limit: 0.30

# CPT-BH proximity distance tolerance (meters) for stage B01
proximity_tolerance: 10
